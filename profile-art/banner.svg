<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">CAESIUM — Research, Systems, Engineering</title>
<desc id="desc">Animated dark terminal banner with a subtle grid, scanning line, and research-oriented identity.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b16"/><stop offset=".55" stop-color="#10132d"/><stop offset="1" stop-color="#21113c"/></linearGradient>
  <linearGradient id="edge"><stop stop-color="#00e5ff"/><stop offset=".52" stop-color="#8d7cff"/><stop offset="1" stop-color="#d66cff"/></linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#83a0ff" stroke-opacity=".12" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="310" rx="20" fill="url(#bg)"/>
<rect width="1200" height="310" rx="20" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="308" rx="19" fill="none" stroke="url(#edge)" stroke-opacity=".8"/>
<g font-family="Consolas, 'Courier New', monospace">
  <rect x="28" y="24" width="1144" height="30" rx="8" fill="#080c18" stroke="#34405f"/>
  <circle cx="47" cy="39" r="4" fill="#ff647c"/><circle cx="63" cy="39" r="4" fill="#ffd166"/><circle cx="79" cy="39" r="4" fill="#06d6a0"/>
  <text x="600" y="43" text-anchor="middle" fill="#8f9ab8" font-size="12">caesium@research-node: ~</text>
  <text x="62" y="111" fill="#00e5ff" font-size="16">$ whoami</text>
  <text x="60" y="172" fill="#f3f6ff" font-size="54" font-weight="700" letter-spacing="4" filter="url(#glow)">CAESIUM</text>
  <rect x="62" y="188" width="280" height="3" rx="1.5" fill="url(#edge)"/>
  <text x="62" y="220" fill="#b8c5e7" font-size="18">CSE · AI/ML RESEARCH · SYSTEMS ENGINEERING</text>
  <text x="62" y="253" fill="#00e5ff" font-size="15">$ build --secure --reproducible --evidence-linked</text>
  <rect x="503" y="238" width="10" height="18" fill="#00e5ff">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.9;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(850 104)" fill="none" stroke-width="1.5">
    <circle cx="110" cy="72" r="76" stroke="#8d7cff" stroke-opacity=".55"><animate attributeName="r" values="72;78;72" dur="7s" repeatCount="indefinite"/></circle>
    <ellipse cx="110" cy="72" rx="110" ry="38" stroke="#00e5ff" stroke-opacity=".7" transform="rotate(-30 110 72)"/>
    <ellipse cx="110" cy="72" rx="110" ry="38" stroke="#d66cff" stroke-opacity=".65" transform="rotate(30 110 72)"/>
    <circle cx="110" cy="72" r="7" fill="#00e5ff" stroke="#00e5ff" filter="url(#glow)"/>
    <circle cx="30" cy="25" r="4" fill="#d66cff" stroke="#d66cff"/>
    <circle cx="201" cy="103" r="4" fill="#00e5ff" stroke="#00e5ff"/>
  </g>
  <rect x="27" y="285" width="1146" height="2" fill="url(#edge)" opacity=".65"/>
  <rect x="27" y="282" width="300" height="8" fill="#00e5ff" opacity=".12">
    <animate attributeName="x" values="-300;1200" dur="8s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>