name: Refresh profile contribution art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-art-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install minimal dependencies
        run: python -m pip install --requirement scripts/requirements.txt
      - name: Fetch public contribution calendar
        env:
          GITHUB_USERNAME: caesium72
        run: python scripts/fetch_contributions.py
      - name: Render local SVG
        run: python scripts/render_heatmap_svg.py
      - name: Commit only changed generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json profile-art/contribution-heatmap.svg
          if git diff --cached --quiet; then
            echo "No contribution-art changes."
            exit 0
          fi
          git commit -m "chore: refresh profile contribution art [skip ci]"
          git push
